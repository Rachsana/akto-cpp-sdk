# Local Kafka cluster for exercising the real KafkaSink path.
#
#   docker compose up -d
#   AKTO_SINK=kafka AKTO_KAFKA_BROKERS=localhost:9092 ./build/akto_echo_server
#
# Watch messages land on the topic:
#   docker exec -it akto-cpp-sdk-kafka-1 \
#     kafka-console-consumer --bootstrap-server localhost:9092 \
#     --topic akto.api.logs --from-beginning

version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
